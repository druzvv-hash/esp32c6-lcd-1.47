name: Build R1 Terminal firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "R1_Terminal/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.2

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino@1.6.6"
          arduino-cli lib install "ArduinoJson@7.4.3"

      - name: Generate build info
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          printf '#pragma once\n#define FW_GIT_HASH "%s"\n' "$SHORT_SHA" > R1_Terminal/build_info.h

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32c6:UploadSpeed=921600,CDCOnBoot=default,CPUFreq=160,FlashFreq=80,FlashMode=qio,FlashSize=8M,PartitionScheme=huge_app,DebugLevel=none,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default" \
            --build-path "$PWD/build" \
            --export-binaries \
            R1_Terminal

      - name: Collect firmware
        run: |
          mkdir -p artifact

          cp build/R1_Terminal.ino.bin artifact/OTA_UPDATE.bin
          cp build/R1_Terminal.ino.bin artifact/app_0x10000.bin
          cp build/R1_Terminal.ino.bootloader.bin artifact/bootloader_0x0.bin
          cp build/R1_Terminal.ino.partitions.bin artifact/partitions_0x8000.bin

          sha256sum artifact/*.bin > artifact/SHA256SUMS.txt

          printf '%s\n' \
            'R1 TERMINAL v0.3' \
            '' \
            'Normal update: upload OTA_UPDATE.bin via C6-OTA.' \
            'Short BOOT: next screen.' \
            'BOOT 2+ sec: OTA.' \
            'BOOT 6+ sec: forget R1 Wi-Fi and enter setup.' \
            > artifact/README.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: R1-Terminal-OTA
          path: artifact/
